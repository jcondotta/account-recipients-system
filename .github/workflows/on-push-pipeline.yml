name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 🔴 obrigatório pro Sonar

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Start infrastructure
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for LocalStack
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:4566/_localstack/health; do sleep 5; done'

      - name: Wait for Redis
        run: |
          timeout 120 bash -c 'until docker exec recipients-redis-ci redis-cli ping; do sleep 5; done'

      - name: Build, Test & Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.login=$SONAR_TOKEN

      - name: Shutdown
        if: always()
        run: docker compose -f docker-compose.ci.yml down