services:

  localstack:
    container_name: "recipients-localstack-4.6.0"
    image: localstack/localstack:4.6.0
    ports:
      - '127.0.0.1:4572:4566'
    environment:
      SERVICES: dynamodb
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      LS_LOG: ${LS_LOG:-debug}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipients-network
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - ./localstack:/etc/localstack/init/ready.d
      - recipients-localstack-volume:/var/lib/localstack

  redis:
    image: redis:7.4.3
    container_name: recipients-redis-7.4.3
    restart: on-failure
    ports:
      - "6382:6379"
    volumes:
      - recipients-redis-volume:/data
    networks:
      - recipients-network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping || exit 1" ]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  kafka-1:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recipients-kafka-1
    hostname: kafka-1
    networks:
      - recipients-network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka-1:9093,
        2@kafka-2:9093,
        3@kafka-3:9093,
        4@kafka-4:9093

      KAFKA_LISTENERS: >
        PLAINTEXT://kafka-1:29092,
        PLAINTEXT_HOST://0.0.0.0:9092,
        CONTROLLER://kafka-1:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka-1:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - recipients-kafka-1-volume:/var/lib/kafka/data

  kafka-2:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recipients-kafka-2
    hostname: kafka-2
    networks:
      - recipients-network
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 2
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka-1:9093,
        2@kafka-2:9093,
        3@kafka-3:9093,
        4@kafka-4:9093

      KAFKA_LISTENERS: >
        PLAINTEXT://kafka-2:29092,
        PLAINTEXT_HOST://0.0.0.0:9094,
        CONTROLLER://kafka-2:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka-2:29092,
        PLAINTEXT_HOST://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - recipients-kafka-2-volume:/var/lib/kafka/data

  kafka-3:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recipients-kafka-3
    hostname: kafka-3
    networks:
      - recipients-network
    ports:
      - "9096:9096"
    environment:
      KAFKA_NODE_ID: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka-1:9093,
        2@kafka-2:9093,
        3@kafka-3:9093,
        4@kafka-4:9093

      KAFKA_LISTENERS: >
        PLAINTEXT://kafka-3:29092,
        PLAINTEXT_HOST://0.0.0.0:9096,
        CONTROLLER://kafka-3:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka-3:29092,
        PLAINTEXT_HOST://localhost:9096

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - recipients-kafka-3-volume:/var/lib/kafka/data

  kafka-4:
    image: confluentinc/cp-kafka:7.6.0
    container_name: recipients-kafka-4
    hostname: kafka-4
    networks:
      - recipients-network
    ports:
      - "9098:9098"
    environment:
      KAFKA_NODE_ID: 4
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: >
        1@kafka-1:9093,
        2@kafka-2:9093,
        3@kafka-3:9093,
        4@kafka-4:9093

      KAFKA_LISTENERS: >
        PLAINTEXT://kafka-4:29092,
        PLAINTEXT_HOST://0.0.0.0:9098,
        CONTROLLER://kafka-4:9093

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka-4:29092,
        PLAINTEXT_HOST://localhost:9098

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - recipients-kafka-4-volume:/var/lib/kafka/data

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: recipients-prometheus
    volumes:
      - recipients-prometheus-volume:/prometheus
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    networks:
      - recipients-network

volumes:
  recipients-localstack-volume:
    name: recipients-localstack-data
  recipients-redis-volume:
    name: recipients-redis-data
  recipients-prometheus-volume:
    name: recipients-prometheus-data
  recipients-kafka-1-volume:
    name: recipients-kafka-1-data
  recipients-kafka-2-volume:
    name: recipients-kafka-2-data
  recipients-kafka-3-volume:
    name: recipients-kafka-3-data
  recipients-kafka-4-volume:
    name: recipients-kafka-4-data

networks:
  recipients-network:
    name: recipients-network