spring:
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6382

app:
  environment: local

cloud:
  aws:
    region:
      static: us-east-1
    credentials:
      access-key-id: test
      secret-key: test
    dynamodb:
      endpoint: http://localhost:4572
      tables:
        account-recipients:
          table-name: 'account-recipients'
    kinesis:
      endpoint: http://localhost:4572
      streams:
        recipients-created:
          stream-name: 'recipients.created'
        recipients-deleted:
          stream-name: 'recipients.deleted'

client:
  api:
    bank-accounts:
      base-url: 'http://localhost:8090'