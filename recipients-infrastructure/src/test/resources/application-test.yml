app:
  environment: test

cloud:
  aws:
    region:
      static: us-east-1
    credentials:
      access-key-id: test
      secret-key: test
    dynamodb:
      endpoint: ${AWS_DYNAMODB_ENDPOINT}
      tables:
        recipients:
          table-name: 'recipients'
    kinesis:
      endpoint: ${AWS_KINESIS_ENDPOINT}
      streams:
        recipients-created:
          stream-name: 'recipients.created'
        recipients-deleted:
          stream-name: 'recipients.deleted'

client:
  api:
    bank-accounts:
      base-url: 'http://localhost:${wiremock.server.port}'

