app:
  environment: ${APPLICATION_ENV:local}

cloud:
  aws:
    region:
      static: ${AWS_DEFAULT_REGION:us-east-1}
    credentials:
      access-key-id: ${AWS_ACCESS_KEY_ID:test}
      secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    dynamodb:
      endpoint: ${AWS_DYNAMODB_ENDPOINT:http://127.0.0.1:4572}
      tables:
        recipients:
          table-name: ${AWS_DYNAMODB_RECIPIENTS_TABLE_NAME:recipients}
    kinesis:
      endpoint: ${AWS_KINESIS_ENDPOINT:http://127.0.0.1:4572}
      streams:
        recipients-created:
          stream-name: ${AWS_KINESIS_RECIPIENTS_CREATED_STREAM_NAME:recipients.created}
        recipients-deleted:
          stream-name: ${AWS_KINESIS_RECIPIENTS_DELETED_STREAM_NAME:recipients.deleted}

client:
  api:
    bank-accounts:
      base-url: ${BANK_ACCOUNTS_API_BASE_URL:http://localhost:8090}